<!-- SEO:BRUJULA:END --><link rel="manifest" href="../site.webmanifest"></head><body class="presentation"><header class="topbar"><div class="shell nav"><a class="brand" href="../">Brújula <span>Municipal</span></a><nav class="navlinks"><a href="../cockpit/">Cockpit</a><a href="../decisiones/">Prioridades</a><a href="../replicar/">Casos</a><a href="../presentacion/" aria-current="page">Presentación</a><a href="../autor/">Autor</a></nav><div class="nav-actions"><button class="btn municipality-btn" data-open-municipality><span data-municipality-label>Seleccionar localidad</span></button></div></div></header><div class="presentation-actions"><div class="shell exec-actions"><button class="btn" onclick="window.print()">Imprimir / guardar PDF</button><button class="btn" id="pack-download">Descargar paquete institucional</button><a class="btn" href="../cockpit/">Volver al cockpit</a></div></div><main id="deck"><section class="slide"><div class="shell"><div class="empty">Selecciona una localidad para generar la presentación.</div></div></section></main><script>
window.addEventListener('bm-ready',async()=>{
 const params=new URLSearchParams(location.search),id=params.get('id');let p=id?await BM.loadPlace(id):BM.getProfile();if(p)BM.setProfile(p);const deck=document.querySelector('#deck');if(!p){deck.innerHTML=`<section class="slide"><div class="shell"><div class="slide-number">Brújula Municipal</div><h1 class="slide-title">Una presentación estratégica para cualquier localidad.</h1><p class="lede" style="color:#c9d9e1">Selecciona un pueblo, municipio o EATIM y genera un relato para reunión, comisión o diputación.</p><button class="btn" data-open-municipality>Seleccionar localidad</button></div></section>`;document.querySelector('[data-open-municipality]').onclick=()=>BM.openSelector();return}
 const pack=await BM.institutionalPack(p),e=pack.executive,top=pack.ranking.slice(0,6),cases=pack.cases.slice(0,4);
 const cards=top.map((r,i)=>`<article class="card"><div class="kicker">Prioridad ${i+1}</div><h3>${r.project.title}</h3><p>${r.project.summary}</p><div class="tag-cloud">${r.reasons.slice(0,3).map(x=>`<span>${x}</span>`).join('')}</div></article>`).join('');
 deck.innerHTML=`<section class="slide"><div class="shell"><div class="slide-number">01 · Contexto</div><div class="kicker">Brújula Municipal</div><h1 class="slide-title">${p.name}: de los datos a una cartera de decisiones.</h1><p class="lede" style="color:#c9d9e1">${p.parent_municipality?'Municipio de '+p.parent_municipality+' · ':''}${p.province||''} · ${p.autonomous_region||''}</p></div></section><section class="slide"><div class="shell"><div class="slide-number">02 · Radiografía</div><h2>Qué caracteriza este territorio</h2><div class="metric-banner">${[['Población','population'],['Densidad','density'],['Mayores de 65','over65'],['Cobertura ≥100 Mbps','broadband100']].map(([l,id])=>`<article class="card"><strong style="font-size:28px;color:var(--blue)">${BM.metricFormat(id,e.metrics?.[id])}</strong><span class="small muted">${l}</span></article>`).join('')}</div><div class="grid grid-3" style="margin-top:20px">${(e.signals||[]).slice(0,6).map(s=>`<article class="card"><h3>${s.title}</h3><p>${s.explanation||''}</p></article>`).join('')}</div></div></section><section class="slide"><div class="shell"><div class="slide-number">03 · Prioridades</div><h2>Seis decisiones que merecen atención</h2><div class="grid grid-3">${cards}</div></div></section><section class="slide"><div class="shell"><div class="slide-number">04 · Financiación y obligaciones</div><h2>Qué puede acelerar o bloquear la ejecución</h2><div class="grid grid-2"><div class="glass-card"><div class="kicker">Financiación</div>${(e.funding||[]).slice(0,5).map(x=>`<div class="mini-item"><strong>${x.o.title}</strong><div class="small muted">${x.m.label}</div></div>`).join('')}</div><div class="glass-card"><div class="kicker">Obligaciones</div>${(e.urgent||[]).slice(0,5).map(x=>`<div class="mini-item"><strong>${x.title}</strong><div class="small muted">Impacto ${x.impact}</div></div>`).join('')}</div></div></div></section><section class="slide"><div class="shell"><div class="slide-number">05 · Precedentes</div><h2>Qué han hecho otros</h2><div class="grid grid-2">${cases.map(x=>`<article class="card"><div class="kicker">${x.case.category}</div><h3>${x.case.municipality}</h3><p><strong>${x.case.project}</strong></p><div class="why">${x.case.replicable}</div></article>`).join('')}</div></div></section><section class="slide"><div class="shell"><div class="slide-number">06 · Hoja de ruta</div><h2>De 90 días a 5 años</h2><div class="timeline-90">${(e.plan.phases||[]).map(ph=>`<div class="phase"><div class="phase-head"><strong>${ph.range}</strong><span>${ph.goal}</span></div>${(ph.actions||[]).slice(0,4).map(a=>`<div class="phase-action">${a}</div>`).join('')}</div>`).join('')}</div><div class="grid grid-3" style="margin-top:20px"><article class="card"><h3>1 año</h3>${(e.portfolio.year1||[]).slice(0,4).map(x=>`<p>${x.title}</p>`).join('')}</article><article class="card"><h3>3 años</h3>${(e.portfolio.year3||[]).slice(0,4).map(x=>`<p>${x.title}</p>`).join('')}</article><article class="card"><h3>5 años</h3>${(e.portfolio.year5||[]).slice(0,4).map(x=>`<p>${x.title}</p>`).join('')}</article></div></div></section><section class="slide"><div class="shell"><div class="slide-number">07 · Cierre</div><h1 class="slide-title">La ventaja no está en tener más información. Está en convertirla en una secuencia defendible de decisiones.</h1><div class="exec-actions" style="margin-top:22px"><a class="btn" href="../autor/">Autor y contacto</a><a class="btn" href="../cockpit/">Abrir cockpit</a></div></div></section>`;
 document.querySelector('#pack-download').onclick=()=>BM.downloadInstitutionalPack(p);
});
</script></main><footer class="footer"><div class="shell"><div class="brand" style="color:white">Brújula <span>Municipal</span></div></div></footer><div class="selector-overlay" id="municipality-overlay"><div class="selector"><div class="selector-head"><div><div class="kicker">Mi localidad</div><h2>Selecciona localidad</h2></div><button class="close" data-close-municipality>×</button></div><input class="field" placeholder="Escribe localidad…"><div class="municipality-results"></div></div></div><script src="../assets/js/app.js"></script></body></html>
