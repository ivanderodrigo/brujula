<!doctype html><html lang="es" data-base="../"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proyecto · Brújula Municipal</title><meta name="description" content="Proyecto municipal priorizado por necesidad, viabilidad y servicios existentes."><link rel="stylesheet" href="../assets/css/styles.css"><meta name="theme-color" content="#0b2b3d"><meta name="robots" content="index,follow"></head><body><a class="skip-link" href="#main-content">Saltar al contenido</a><header class="topbar simple-topbar"><div class="shell nav"><a class="brand" href="../">Brújula <span>Municipal</span></a><nav class="navlinks" aria-label="Navegación principal"></nav><div class="nav-actions"><button class="btn municipality-btn" data-open-municipality><span data-municipality-label>Elegir municipio</span></button></div></div></header><main id="main-content"><section class="simple-page-hero"><div class="shell" id="head"><h1>Cargando…</h1></div></section><section class="rich-section"><div class="shell" id="body"></div></section></main><footer class="footer simple-footer"><div class="shell simple-footer-grid"><div><div class="brand" style="color:white">Brújula <span>Municipal</span></div><p class="small">Actuar sin sobredimensionar.</p></div><div><strong>Principio</strong><p class="small">Reutilizar antes de comprar.</p></div><div><strong>Acción</strong><p class="small"><a href="../plan/">Mi plan</a></p></div></div></footer><div class="selector-overlay" id="municipality-overlay"><div class="selector"><div class="selector-head"><div><div class="kicker">Tu municipio</div><h2>Selecciona entidad</h2></div><button class="close" data-close-municipality>×</button></div><input class="field" placeholder="Municipio, pueblo o EATIM…"><div class="municipality-results"></div></div></div><script src="../assets/js/app.js"></script><script>
window.addEventListener('bm-ready',async()=>{const id=new URLSearchParams(location.search).get('id'),projects=await BM.json('data/catalog/proyectos.json'),proj=projects.find(x=>x.id===id),p=BM.getProfile(),head=document.querySelector('#head'),body=document.querySelector('#body');if(!proj){head.innerHTML='<h1>Proyecto no encontrado.</h1>';return}let row=null,ctx=null;if(p){ctx=await BM.smartContext(p);row=(await BM.smartProjectRecommendations(p,projects.length)).find(x=>x.p.id===id)}head.innerHTML=`<a class="small muted" href="./">← Volver a proyectos</a><span class="simple-eyebrow">${BM.escapeHtml(proj.category)}</span><h1>${BM.escapeHtml(proj.title)}</h1><p>${BM.escapeHtml(proj.summary)}</p>`;const related=row?.funding?[row.funding]:[],author=(p&&row?.externalSupport?.show)?await BM.author().catch(()=>null):null;body.innerHTML=`${p&&row?`<div class="smart-context"><span>Para ${BM.escapeHtml(p.name)}</span><b>${BM.escapeHtml(row.decisionLabel)}</b><b>Ahora: ${BM.escapeHtml(row.nextAction||'Definir el siguiente paso.')}</b>${row.reasons.slice(0,3).map(x=>`<b>${BM.escapeHtml(x)}</b>`).join('')}<details><summary>Cómo se prioriza</summary><p>Necesidad territorial y obligaciones primero; después viabilidad para la escala local, esfuerzo real de implantación, mantenimiento y capacidad probable. Si existe servicio común o apoyo provincial, Brújula lo coloca antes de comprar. La financiación acelera, pero no crea por sí sola una prioridad.</p></details></div>`:''}<div class="metric-strip"><div class="metric-pill"><strong>${BM.escapeHtml(proj.complexity||'—')}</strong><span>complejidad</span></div><div class="metric-pill"><strong>${BM.escapeHtml(proj.cost_band||'—')}</strong><span>orden de coste</span></div><div class="metric-pill"><strong>${BM.escapeHtml(proj.duration_band||'—')}</strong><span>duración orientativa</span></div><div class="metric-pill"><strong>${p&&ctx?BM.escapeHtml(ctx.capacity?.label||'—'):'—'}</strong><span>escala usada por Brújula</span></div></div><div class="grid grid-2" style="margin-top:22px"><div class="layer-card"><div class="layer-head"><div><span class="rich-kicker">Empezar bien</span><h3>Primeros pasos</h3></div></div><div class="clean-list">${(proj.first_steps||[]).map((x,i)=>`<div class="clean-row"><span class="clean-index">${String(i+1).padStart(2,'0')}</span><div class="clean-copy"><p>${BM.escapeHtml(x)}</p></div></div>`).join('')}</div></div><div class="layer-card"><div class="layer-head"><div><span class="rich-kicker">Evitar errores</span><h3>Antes de contratar</h3></div></div><div style="padding:0 24px 24px">${row?.provincial?.length?`<p><strong>Apoyo provincial:</strong> ${BM.escapeHtml(row.provincial.map(x=>x.title).join(' · '))}</p>`:''}${row?.common?.length?`<p><strong>Servicios comunes:</strong> ${BM.escapeHtml(row.common.map(x=>x.title).join(' · '))}</p>`:''}${related.length?`<p><strong>Financiación relacionada:</strong> <a href="../oportunidades/detalle.html?id=${related[0].o.id}">${BM.escapeHtml(related[0].o.title)}</a></p>`:''}<p><strong>Mantenimiento:</strong> ${BM.escapeHtml(proj.maintenance||'Definir responsable, soporte y costes recurrentes.')}</p><p><strong>Riesgos:</strong> ${BM.escapeHtml((proj.risks||[]).join(' · ')||'Revisar alcance, mantenimiento y contratación.')}</p></div></div></div>${author?`<div class="author-help-card"><div><span class="rich-kicker">Apoyo solo si hace falta</span><h3>Este proyecto puede necesitar ayuda externa para ponerse en marcha.</h3><p>${BM.escapeHtml(row.externalSupport.reason)}</p><p class="small muted">${BM.escapeHtml(row.externalSupport.caution)}</p></div><div class="author-help-action"><span>Autor de Brújula Municipal</span><strong>${BM.escapeHtml(author.name)}</strong><p>${BM.escapeHtml(author.role||'')}</p><a class="btn simple-primary" href="${BM.escapeHtml(author.linkedin_url)}" target="_blank" rel="noopener">Contactar con el autor ↗</a></div></div>`:''}`;BM.applySimpleChrome();});
</script></body></html>
