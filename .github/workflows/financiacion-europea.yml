name: Vigilar fuentes de financiación

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  funding-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/actualizar_fuentes_financiacion.py
      - name: Guardar estado si cambia
        run: |
          git config user.name "brujula-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/generated/funding_sources_status.json tools/cache/funding_sources || true
          git diff --cached --quiet || git commit -m "data: vigilar fuentes de financiación"
          git push
