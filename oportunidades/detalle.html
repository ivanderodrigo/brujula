<!doctype html><html lang="es" data-base="../"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ayuda · Brújula Municipal</title><meta name="description" content="Encaje municipal explicable de una convocatoria o candidato BDNS."><link rel="stylesheet" href="../assets/css/styles.css"><meta name="theme-color" content="#0b2b3d"><meta name="robots" content="index,follow"><link rel="canonical" href="https://brujulamunicipal.eu.org/oportunidades/detalle.html"></head><body><a class="skip-link" href="#main-content">Saltar al contenido</a><header class="topbar simple-topbar"><div class="shell nav"><a class="brand" href="../">Brújula <span>Municipal</span></a><nav class="navlinks" aria-label="Navegación principal"></nav><div class="nav-actions"><button class="btn municipality-btn" data-open-municipality><span data-municipality-label>Elegir municipio</span></button></div></div></header>
<main id="main-content"><section class="simple-page-hero"><div class="shell" id="opp-head"><span class="simple-eyebrow">Ayudas</span><h1>Cargando…</h1></div></section><section class="rich-section"><div class="shell" id="opp-body"></div></section></main>
<footer class="footer simple-footer"><div class="shell simple-footer-grid"><div><div class="brand" style="color:white">Brújula <span>Municipal</span></div><p class="small">Muchos datos detrás. Una decisión clara delante.</p></div><div><strong>Rigor</strong><p class="small">La elegibilidad siempre se confirma en las bases.</p></div><div><strong>Acción</strong><p class="small"><a href="../plan/">Mi plan</a></p></div></div></footer>
<div class="selector-overlay" id="municipality-overlay"><div class="selector"><div class="selector-head"><div><div class="kicker">Tu municipio</div><h2>¿Qué ayuntamiento quieres consultar?</h2></div><button class="close" data-close-municipality aria-label="Cerrar">×</button></div><input class="field" placeholder="Escribe municipio, pueblo o EATIM…"><div class="municipality-results"></div></div></div>
<script src="../assets/js/app.js"></script><script>
window.addEventListener('bm-ready',async()=>{const id=new URLSearchParams(location.search).get('id'),all=await BM.opportunities(),o=all.find(x=>x.id===id),head=document.querySelector('#opp-head'),body=document.querySelector('#opp-body');if(!o){head.innerHTML='<span class="simple-eyebrow">Ayudas</span><h1>Oportunidad no encontrada.</h1>';return}const p=BM.getProfile(),ctx=p?await BM.smartContext(p):null,fit=p?await BM.smartOpportunityFit(o,ctx):null,pending=o.review_status==='pending';head.innerHTML=`<a class="small muted" href="./">← Volver a ayudas</a><span class="simple-eyebrow">${pending?'Radar BDNS':'Convocatoria verificada'}</span><h1>${BM.escapeHtml(o.title)}</h1><p>${BM.escapeHtml(o.summary||'')}</p>`;
const popRules=(o.population_rules||[]).map(r=>`${r.min!=null?'≥ '+BM.number(r.min):''}${r.min!=null&&r.max!=null?' y ':''}${r.max!=null?'≤ '+BM.number(r.max):''} habitantes${r.basis&&r.basis!=='unknown'?' · '+r.basis:''}`);const ben=(o.beneficiary_descriptions||o.beneficiary_types||[]),territ=(o.territories||[]);body.innerHTML=`${p?`<div class="smart-context"><span>Para ${BM.escapeHtml(p.name)}</span><b>${BM.escapeHtml(fit.label)}</b>${fit.reasons.map(x=>`<b>${BM.escapeHtml(x)}</b>`).join('')}<details><summary>Cómo ha llegado Brújula a esta conclusión</summary><p>Primero comprueba beneficiario, territorio, población y plazo. Solo después usa el contexto del municipio para ordenar la oportunidad. “Buen candidato” nunca significa elegibilidad confirmada.</p></details></div>`:`<div class="smart-context"><span>Selecciona municipio para valorar el encaje</span></div>`}<div class="layer-card"><div class="layer-head"><div><span class="rich-kicker">Lo esencial</span><h3>Qué sabemos de la convocatoria</h3></div><span class="mini-chip ${pending?'review':''}">${BM.escapeHtml(o.status_label||BM.statusText(o.status))}</span></div><div class="metric-strip"><div class="metric-pill"><strong>${BM.escapeHtml(o.organization||'—')}</strong><span>organismo</span></div><div class="metric-pill"><strong>${o.deadline||'—'}</strong><span>fin de solicitud detectado</span></div><div class="metric-pill"><strong>${o.budget_total?BM.money(o.budget_total):'—'}</strong><span>presupuesto convocatoria</span></div><div class="metric-pill"><strong>${BM.escapeHtml(o.extraction_confidence|| (pending?'pendiente':'verificada'))}</strong><span>confianza de extracción</span></div></div></div><div class="grid grid-2" style="margin-top:22px"><div class="layer-card"><div class="layer-head"><div><span class="rich-kicker">Condiciones detectadas</span><h3>Lo que usa el filtro</h3></div></div><div class="clean-list"><div class="clean-row"><span class="clean-index">01</span><div class="clean-copy"><h4>Beneficiarios</h4><p>${BM.escapeHtml(ben.length?ben.join(' · '):'No confirmados estructuradamente')}</p></div></div><div class="clean-row"><span class="clean-index">02</span><div class="clean-copy"><h4>Territorio</h4><p>${BM.escapeHtml(territ.length?territ.join(' · '):(o.scope||'Por confirmar'))}</p></div></div><div class="clean-row"><span class="clean-index">03</span><div class="clean-copy"><h4>Población</h4><p>${BM.escapeHtml(popRules.length?popRules.join(' · '):'Sin umbral explícito detectado')}</p></div></div><div class="clean-row"><span class="clean-index">04</span><div class="clean-copy"><h4>Temas</h4><p>${BM.escapeHtml((o.topics||[]).join(' · ')||'—')}</p></div></div></div></div><div class="layer-card"><div class="layer-head"><div><span class="rich-kicker">Antes de decidir</span><h3>Qué falta comprobar</h3></div></div><div style="padding:0 24px 24px"><p>${BM.escapeHtml(o.warning||'Revisar beneficiarios, plazo, gastos elegibles, documentación y criterios en las bases oficiales.')}</p>${o.bases_title?`<p><strong>Bases:</strong> ${BM.escapeHtml(o.bases_title)}</p>`:''}<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:18px"><a class="btn" href="${o.source}" target="_blank" rel="noopener">Ficha oficial BDNS ↗</a>${o.bases_url?`<a class="btn" href="${o.bases_url}" target="_blank" rel="noopener">Bases reguladoras ↗</a>`:''}${o.electronic_office?`<a class="btn" href="${o.electronic_office}" target="_blank" rel="noopener">Sede electrónica ↗</a>`:''}</div></div></div></div>`;BM.applySimpleChrome();});
</script></body></html>
